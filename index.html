<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Planning Benchmark — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root {
  --bg: #0b0d10;
  --bg-raise: #14171c;
  --bg-raise-2: #1c2026;
  --line: #262b33;
  --line-soft: #1e2229;
  --fg: #f2f0ea;
  --fg-soft: #bcb8ad;
  --fg-mute: #8a887f;
  --gold: #d4b36a;
  --gold-soft: #ad8f4f;
  --silver: #b9c0c7;
  --bronze: #c88e5b;
  --sage: #8eb28c;
  --teal: #6fb2b6;
  --terra: #d48c5a;
  --rose: #d46a6a;
  --mauve: #b47fc2;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-1: 0 1px 0 rgba(255,255,255,0.03), 0 8px 24px rgba(0,0,0,0.35);
  --shadow-2: 0 2px 0 rgba(255,255,255,0.04), 0 18px 40px rgba(0,0,0,0.55);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: var(--teal); text-decoration: none; }
a:hover { color: var(--fg); }
button { font-family: inherit; color: inherit; }
::selection { background: var(--gold); color: #000; }

/* --- Layout scaffolding --- */
.shell { max-width: 1440px; margin: 0 auto; padding: 20px 32px 48px; }
@media (max-width: 900px) { .shell { padding: 16px; } }

/* --- Header --- */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding-bottom: 20px; border-bottom: 1px solid var(--line-soft);
  margin-bottom: 24px;
}
.topbar h1 {
  margin: 0;
  font-weight: 800; font-size: 20px; letter-spacing: -0.015em;
}
.topbar .tagline {
  font-size: 13px; color: var(--fg-mute); margin-left: 4px;
}
.topbar .spacer { flex: 1; }
.topbar .meta-chip {
  font-family: var(--mono); font-size: 12px; color: var(--fg-mute);
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg-raise);
}
.topbar button.icon-btn {
  background: var(--bg-raise); border: 1px solid var(--line);
  color: var(--fg-soft); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s ease;
}
.topbar button.icon-btn:hover { border-color: var(--gold); color: var(--fg); }
.topbar button.icon-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,179,106,0.08); }

/* --- Hero leaderboard --- */
.hero {
  display: grid; grid-template-columns: 1.5fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 24px;
}
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.hero-card {
  position: relative;
  background: var(--bg-raise);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease;
  overflow: hidden;
  min-height: 150px;
}
.hero-card:hover { transform: translateY(-2px); border-color: var(--gold-soft); }
.hero-card.rank-1 {
  background: linear-gradient(135deg, #1a1814 0%, #14171c 60%);
  border-color: rgba(212,179,106,0.35);
}
.hero-card.rank-1::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, rgba(212,179,106,0.12), transparent 55%);
  pointer-events: none;
}
.hero-card .rank-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--fg-mute); font-weight: 500;
  margin-bottom: 10px;
}
.rank-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 999px;
}
.rank-1 .rank-dot { background: var(--gold); box-shadow: 0 0 12px rgba(212,179,106,0.6); }
.rank-2 .rank-dot { background: var(--silver); }
.rank-3 .rank-dot { background: var(--bronze); }
.rank-1 .rank-badge { color: var(--gold); }
.rank-2 .rank-badge { color: var(--silver); }
.rank-3 .rank-badge { color: var(--bronze); }
.hero-card .model-name {
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  line-height: 1.15; margin-bottom: 4px;
}
.hero-card.rank-1 .model-name { font-size: 26px; }
.hero-card .sub-line {
  font-size: 13px; color: var(--fg-soft); margin-bottom: 14px;
}
.hero-card .sub-line .pill { margin-right: 8px; }
.hero-card .score {
  display: flex; align-items: baseline; gap: 8px;
}
.hero-card .score .num {
  font-family: var(--mono); font-weight: 600; font-size: 40px;
  letter-spacing: -0.02em; color: var(--fg);
}
.hero-card.rank-1 .score .num { font-size: 52px; color: var(--gold); }
.hero-card .score .unit { font-size: 14px; color: var(--fg-mute); }
.hero-card .score .label { font-size: 12px; color: var(--fg-mute); margin-left: auto; }
.hero-card .add-btn {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px; border-radius: 999px;
  background: var(--bg-raise-2); border: 1px solid var(--line);
  color: var(--fg-soft); font-size: 16px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
  opacity: 0; transition: opacity 0.15s, background 0.15s, color 0.15s;
}
.hero-card:hover .add-btn { opacity: 1; }
.hero-card .add-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
.hero-card .add-btn.in-tray { opacity: 1; background: var(--sage); color: #000; border-color: var(--sage); }

.pill {
  display: inline-block;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 4px;
  background: var(--bg-raise-2); color: var(--fg-soft);
  border: 1px solid var(--line); vertical-align: middle;
}
.pill.plan { background: rgba(143,178,140,0.12); color: var(--sage); border-color: rgba(143,178,140,0.3); }
.pill.no-plan { background: rgba(212,140,90,0.12); color: var(--terra); border-color: rgba(212,140,90,0.3); }
.pill.family-claude { background: rgba(180,127,194,0.12); color: var(--mauve); border-color: rgba(180,127,194,0.3); }
.pill.family-openai { background: rgba(143,178,140,0.12); color: var(--sage); border-color: rgba(143,178,140,0.3); }
.pill.family-gemini { background: rgba(111,178,182,0.12); color: var(--teal); border-color: rgba(111,178,182,0.3); }

/* --- Compare Tray --- */
.tray {
  position: sticky; top: 0; z-index: 30;
  background: rgba(11,13,16,0.92);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
  min-height: 52px;
}
.tray-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--fg-mute);
  white-space: nowrap;
}
.tray-label .count {
  font-family: var(--mono); color: var(--gold); font-weight: 600;
  margin-left: 4px;
}
.tray-slots {
  display: flex; gap: 8px; flex-wrap: wrap; flex: 1;
  min-height: 32px; align-items: center;
}
.tray-slot-empty {
  display: inline-flex; align-items: center;
  font-size: 12px; color: var(--fg-mute); font-style: italic;
}
.tray-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-raise-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 8px 5px 12px;
  font-size: 13px; font-weight: 500;
  transition: border-color 0.15s;
}
.tray-chip:hover { border-color: var(--gold-soft); }
.tray-chip .swatch {
  display: inline-block; width: 8px; height: 8px; border-radius: 999px;
}
.tray-chip .slot-num {
  display: inline-grid; place-items: center;
  width: 18px; height: 18px; border-radius: 5px;
  font-family: var(--mono); font-size: 11px; font-weight: 700;
}
.tray-chip .close {
  background: none; border: none; color: var(--fg-mute); cursor: pointer;
  width: 18px; height: 18px; border-radius: 999px; font-size: 14px; line-height: 1;
  display: grid; place-items: center;
}
.tray-chip .close:hover { color: var(--rose); background: rgba(212,106,106,0.1); }
.tray-actions { display: flex; gap: 8px; }
.btn {
  background: var(--bg-raise); border: 1px solid var(--line); color: var(--fg-soft);
  border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: var(--font);
}
.btn:hover { border-color: var(--gold-soft); color: var(--fg); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }
.btn.primary:hover { background: #e8c679; }

/* --- Comparison panel (expands under tray when tray has 2+) --- */
.compare-panel {
  background: var(--bg-raise);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 18px;
}
.compare-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.compare-head h3 {
  margin: 0; font-size: 14px; font-weight: 600;
  letter-spacing: 0.02em; text-transform: uppercase; color: var(--fg-soft);
}
.controlled-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 3px 10px; border-radius: 999px;
  background: rgba(143,178,140,0.12); color: var(--sage); border: 1px solid rgba(143,178,140,0.3);
}
.controlled-badge.amber {
  background: rgba(212,179,106,0.1); color: var(--gold); border-color: rgba(212,179,106,0.3);
}
.controlled-badge.red {
  background: rgba(212,106,106,0.1); color: var(--rose); border-color: rgba(212,106,106,0.3);
}
.compare-grid {
  display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 1fr);
  gap: 20px;
}
@media (max-width: 900px) { .compare-grid { grid-template-columns: 1fr; } }
.delta-row {
  display: grid;
  grid-template-columns: 68px 1fr auto;
  align-items: center; gap: 10px;
  padding: 6px 0;
}
.delta-row + .delta-row { border-top: 1px dashed var(--line-soft); }
.delta-label {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--fg-mute); text-transform: uppercase; letter-spacing: 0.05em;
}
.delta-bars { display: flex; flex-direction: column; gap: 4px; }
.delta-row-mini {
  display: grid; grid-template-columns: 110px 1fr 56px; align-items: center; gap: 8px;
  font-size: 12px;
}
.delta-row-mini .mname {
  color: var(--fg-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: inline-flex; align-items: center; gap: 6px;
}
.slot-tag {
  display: inline-grid; place-items: center;
  width: 16px; height: 16px; border-radius: 4px;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  flex-shrink: 0;
}
.delta-row-mini .mval {
  font-family: var(--mono); font-weight: 600; text-align: right; color: var(--fg);
}
.bar-track {
  height: 14px; background: var(--bg-raise-2); border-radius: 4px; overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%; border-radius: 4px;
  transition: width 0.5s cubic-bezier(0.2,0.8,0.2,1);
}

/* --- Tab nav --- */
.tabs {
  display: flex; gap: 2px; margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.tab {
  background: none; border: none; color: var(--fg-mute);
  font-size: 14px; font-weight: 500; padding: 10px 16px;
  cursor: pointer; position: relative; font-family: var(--font);
  letter-spacing: -0.005em;
}
.tab:hover { color: var(--fg-soft); }
.tab.active { color: var(--fg); }
.tab.active::after {
  content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px;
  height: 2px; background: var(--gold); border-radius: 2px;
}

/* --- Filter bar --- */
.filters {
  display: flex; gap: 14px; flex-wrap: wrap;
  padding: 12px 14px; margin-bottom: 14px;
  background: var(--bg-raise); border: 1px solid var(--line);
  border-radius: var(--radius);
}
.filter-group { display: flex; align-items: center; gap: 6px; }
.filter-group label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--fg-mute);
}
select, input[type=search] {
  background: var(--bg-raise-2); border: 1px solid var(--line);
  color: var(--fg); border-radius: 6px; padding: 5px 8px;
  font-family: var(--font); font-size: 12px;
}
select:focus, input[type=search]:focus { outline: none; border-color: var(--gold-soft); }

/* --- Canvas / views --- */
.view-wrap {
  background: var(--bg-raise); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 18px;
  min-height: 420px;
}
.view-head {
  display: flex; align-items: flex-end; gap: 14px; margin-bottom: 14px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line-soft);
}
.view-head h2 {
  margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.015em;
}
.view-head p { margin: 4px 0 0; font-size: 13px; color: var(--fg-mute); }
.view-head .spacer { flex: 1; }

/* --- Leaderboard sections --- */
.lb-section + .lb-section { margin-top: 22px; }
.lb-section-head {
  display: flex; align-items: baseline; gap: 14px;
  padding: 0 4px 8px; margin-bottom: 4px;
  border-bottom: 1px solid var(--line-soft);
}
.lb-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--fg);
}
.lb-section-tray .lb-section-title { color: var(--gold); }
.lb-section-tray { padding: 12px 14px; background: rgba(212,179,106,0.035);
  border: 1px solid rgba(212,179,106,0.18); border-radius: var(--radius);
}

/* --- Leaderboard table --- */
.lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.lb-table th {
  text-align: left; padding: 10px 8px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--fg-mute);
  border-bottom: 1px solid var(--line);
  cursor: pointer; user-select: none; white-space: nowrap;
}
.lb-table th.sortable:hover { color: var(--fg); }
.lb-table th .sort-arrow { color: var(--gold); margin-left: 4px; }
.lb-table td {
  padding: 12px 8px; border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.lb-table tr { cursor: pointer; transition: background 0.1s; }
.lb-table tbody tr:hover { background: rgba(255,255,255,0.02); }
.lb-table tr.in-tray td:first-child {
  border-left: 3px solid var(--slot-color, var(--gold)); padding-left: 12px;
}
.lb-rank {
  font-family: var(--mono); font-size: 12px; color: var(--fg-mute); width: 32px;
}
.lb-rank.top-3 { color: var(--gold); font-weight: 600; }
.lb-model {
  font-weight: 600; font-size: 14px; letter-spacing: -0.005em;
}
.lb-sub { font-size: 11px; color: var(--fg-mute); margin-top: 2px; font-family: var(--mono); }
.lb-score-cell { width: 180px; }
.lb-score {
  font-family: var(--mono); font-weight: 600; font-size: 15px;
  text-align: right; min-width: 54px; display: inline-block;
}
.lb-score-bar { display: grid; grid-template-columns: 1fr 54px; gap: 10px; align-items: center; }
.lb-sevs {
  display: flex; gap: 3px; align-items: center;
}
.lb-sev-dot {
  width: 12px; height: 20px; border-radius: 2px; background: var(--bg-raise-2);
  position: relative; overflow: hidden;
}
.lb-sev-dot .fill { position: absolute; bottom: 0; left: 0; right: 0; }
.lb-area-spark {
  display: flex; gap: 1px; align-items: flex-end; height: 22px; width: 100px;
}
.lb-area-spark .b { flex: 1; background: var(--gold-soft); border-radius: 1px 1px 0 0; min-height: 2px; }

/* --- Frontier chart --- */
#frontier-chart { width: 100%; height: 520px; }
.frontier-legend {
  display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
  font-size: 12px; color: var(--fg-mute);
}
.frontier-legend .swatch {
  display: inline-block; width: 10px; height: 10px; border-radius: 999px;
  margin-right: 6px; vertical-align: middle;
}
.compare-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--gold);
  padding: 4px 10px; border-radius: 999px;
  background: rgba(212,179,106,0.08); border: 1px solid rgba(212,179,106,0.3);
}
.scope-toggle {
  display: inline-flex; background: var(--bg-raise-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px;
}
.scope-toggle button {
  background: none; border: none; color: var(--fg-mute);
  padding: 5px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
}
.scope-toggle button.active {
  background: var(--gold); color: #0b0d10;
}
.scope-toggle button:not(.active):hover { color: var(--fg); }

/* --- Heatmap chart --- */
#heatmap-chart { width: 100%; height: 560px; }

/* --- Deep Dive --- */
.dd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1000px) { .dd-grid { grid-template-columns: 1fr; } }
.dd-panel { background: var(--bg-raise-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.dd-panel h3 {
  margin: 0 0 10px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-mute);
}
.dd-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.dd-score-cell {
  background: var(--bg-raise); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px;
  text-align: center;
}
.dd-score-cell .label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--fg-mute);
}
.dd-score-cell .num {
  font-family: var(--mono); font-weight: 600; font-size: 24px;
  margin-top: 6px; letter-spacing: -0.015em;
}
.dd-score-cell.overall .num { font-size: 32px; color: var(--gold); }
.dd-area-row {
  display: grid; grid-template-columns: 1fr 36px 60px; gap: 10px;
  align-items: center; padding: 5px 0;
  font-size: 13px;
}
.dd-area-row + .dd-area-row { border-top: 1px dashed var(--line-soft); }
.dd-area-row .name { color: var(--fg-soft); }
.dd-area-row .val { font-family: var(--mono); text-align: right; color: var(--fg); }
.dd-area-row .bar { height: 8px; background: var(--bg-raise); border-radius: 3px; overflow: hidden; }
.dd-area-row .bar .fill { height: 100%; border-radius: 3px; }
.dd-gap {
  border-left: 3px solid var(--line);
  padding: 8px 10px; margin-bottom: 8px;
  background: var(--bg-raise); border-radius: 0 4px 4px 0;
}
.dd-gap.sev-critical { border-left-color: var(--rose); }
.dd-gap.sev-important { border-left-color: var(--gold); }
.dd-gap.sev-detail { border-left-color: var(--teal); }
.dd-gap .sev {
  display: inline-block; font-family: var(--mono);
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--fg-mute); margin-right: 8px;
}
.dd-gap.sev-critical .sev { color: var(--rose); }
.dd-gap.sev-important .sev { color: var(--gold); }
.dd-gap .label { font-weight: 500; font-size: 13px; }
.dd-narrative p { font-size: 13px; color: var(--fg-soft); line-height: 1.55; margin: 0 0 10px; }
.dd-narrative strong { color: var(--fg); font-weight: 600; }
.dd-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.dd-links a {
  background: var(--bg-raise); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.dd-links a:hover { border-color: var(--gold-soft); color: var(--fg); }

/* --- Footer --- */
footer {
  margin-top: 40px; padding-top: 20px;
  border-top: 1px solid var(--line-soft);
  display: flex; flex-wrap: wrap; gap: 14px;

}
</style>

<body>
<script>document.write('<script src="data.js?t=' + Date.now() + '"><\/script>');</script>
<div class="shell">

<header class="topbar">
  <h1>Planning Benchmark</h1>

<!-- Hero leaderboard: top 3 -->

<!-- Tab nav -->

  </div>
  <div class="filter-group">

  </div>

<footer>
  <span id="gen-stamp" class="muted"></span>
  <span class="spacer" style="flex:1"></span>
  <a href="DASHBOARD_PURPOSE.md">Charter</a>
  <a href="v2.html">v2 (dark gold/sage)</a>
  <a href="index_orig.html">v1 (light theme)</a>
  <a href="https://github.com/bladnman/planning_benchmark">benchmark source</a>
  <a href="https://github.com/bladnman/planning_benchmark_results">results source</a>
</footer>

</div>
<script>
/* ==========================================================================
   Planning Benchmark Dashboard — v3
   Built to DASHBOARD_PURPOSE.md. Single-file, no build step.
   ========================================================================== */

const DATA = window.__DASHBOARD_DATA__;
if (!DATA) throw new Error('dashboard data failed to load');
const RUNS = DATA.runs || [];

// ---------- State ----------
const state = {
  view: 'leaderboard',
  metric: 'overall',
  tray: [],       // run_ids
  scope: 'tray',  // 'tray' | 'all' — which runs charts focus on when tray has items
  filters: { family: '', tool: '', planning_mode: '' },
  sortKey: 'scores.overall',
  sortDir: 'desc',
  deepdive: null,
  recordMode: false,
};

// ---------- Helpers ----------
const TRAY_CAP = 6;
// Tray slot palette: stable colors per compare slot, distinct from leader gold
// so the leader's gold on hero cards never competes with tray encodings.
const TRAY_COLORS = ['#6fb2b6', '#b47fc2', '#8eb28c', '#d48c5a', '#d46a6a', '#b9c0c7'];
const TRAY_NAMES = ['Teal', 'Mauve', 'Sage', 'Terra', 'Rose', 'Silver'];
const FAMILY_COLOR = {
  'claude': '#b47fc2',
  'gpt': '#8eb28c',
  'gemini': '#6fb2b6',
};
const TOOL_COLOR = {
  'claude_code': '#b47fc2',
  'cursor': '#d4b36a',
  'codex_cli': '#8eb28c',
  'gemini_cli': '#6fb2b6',
};
function familyKey(r) {
  const f = (r.model_family || r.manufacturer || '').toLowerCase();
  if (f.includes('claude') || f.includes('anthropic')) return 'claude';
  if (f.includes('gpt') || f.includes('openai')) return 'gpt';
  if (f.includes('gemini') || f.includes('google')) return 'gemini';
  return 'other';
}
function familyColor(r) { return FAMILY_COLOR[familyKey(r)] || '#bcb8ad'; }
function toolColor(r) { return TOOL_COLOR[r.tool_slug] || '#8a887f'; }
function traySlotIndex(runId) { return state.tray.indexOf(runId); }
function trayColor(runId) {
  const i = traySlotIndex(runId);
  return i >= 0 ? TRAY_COLORS[i] : null;
}
// Prefer tray slot color when a run is being compared; fall back to family.
function runColor(runOrId) {
  const id = typeof runOrId === 'string' ? runOrId : runOrId.run_id;
  const r = typeof runOrId === 'string' ? findRun(id) : runOrId;
  return trayColor(id) || (r ? familyColor(r) : '#bcb8ad');
}
function planLabel(r) {
  if (r.planning_mode === true) return 'Plan';
  if (r.planning_mode === false) return 'No Plan';
  return null;
}
function displayName(r) {
  const effort = r.effort ? ` ${r.effort}` : '';
  return `${r.model_name || r.model_id}${effort}`.trim();
}
function shortTool(r) {
  const map = { 'claude_code': 'Claude Code', 'cursor': 'Cursor', 'codex_cli': 'Codex CLI', 'gemini_cli': 'Gemini CLI' };
  return map[r.tool_slug] || r.tool || r.tool_slug || '—';
}
function scoreColor(v) {
  if (v >= 88) return '#8eb28c';
  if (v >= 72) return '#d4b36a';
  if (v >= 55) return '#d48c5a';
  return '#d46a6a';
}
function findRun(id) { return RUNS.find(r => r.run_id === id); }
function fmt(v, d = 1) { return v == null || isNaN(v) ? '—' : Number(v).toFixed(d); }
function fmtSec(s) {
  if (s == null) return '—';
  if (s < 60) return `${Math.round(s)}s`;
  const m = Math.floor(s / 60); const sec = Math.round(s % 60);
  return sec ? `${m}m ${sec}s` : `${m}m`;
}
function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  return m ? `${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)}` : '0,0,0';
}

// ---------- URL state sync ----------
function readURL() {
  const p = new URLSearchParams(location.search);
  if (p.get('view')) state.view = p.get('view');
  if (p.get('metric')) state.metric = p.get('metric');
  if (p.get('tray')) state.tray = p.get('tray').split(',').filter(Boolean).slice(0, TRAY_CAP);
  if (p.get('scope')) state.scope = p.get('scope');
  if (p.get('family')) state.filters.family = p.get('family');
  if (p.get('tool')) state.filters.tool = p.get('tool');
  if (p.get('plan')) state.filters.planning_mode = p.get('plan');
  if (p.get('dd')) state.deepdive = p.get('dd');
  if (p.get('record') === '1') state.recordMode = true;
}
function writeURL() {
  const p = new URLSearchParams();
  if (state.view !== 'leaderboard') p.set('view', state.view);
  if (state.metric !== 'overall') p.set('metric', state.metric);
  if (state.tray.length) p.set('tray', state.tray.join(','));
  if (state.scope !== 'tray') p.set('scope', state.scope);
  if (state.filters.family) p.set('family', state.filters.family);
  if (state.filters.tool) p.set('tool', state.filters.tool);
  if (state.filters.planning_mode) p.set('plan', state.filters.planning_mode);
  if (state.deepdive) p.set('dd', state.deepdive);
  if (state.recordMode) p.set('record', '1');
  const qs = p.toString();
  history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
}

// ---------- Filtering ----------
function filteredRuns() {
  return RUNS.filter(r => {
    if (state.filters.family && familyKey(r) !== state.filters.family) return false;
    if (state.filters.tool && r.tool_slug !== state.filters.tool) return false;
    const pm = state.filters.planning_mode;
    if (pm === 'true' && r.planning_mode !== true) return false;
    if (pm === 'false' && r.planning_mode !== false) return false;
    return true;
  });
}
function sortedRuns() {
  const list = filteredRuns().slice();
  list.sort((a, b) => {
    const av = a.scores?.[state.metric] ?? -1;
    const bv = b.scores?.[state.metric] ?? -1;
    return bv - av;
  });
  return list;
}
// Returns runs a chart should focus on. If the tray has items and scope=tray,
// that's the tray set (in tray order). Otherwise returns the filtered run set.
function scopedRuns() {
  if (state.scope === 'tray' && state.tray.length) {
    return state.tray.map(findRun).filter(Boolean);
  }
  return sortedRuns();
}
function scopeActive() { return state.scope === 'tray' && state.tray.length > 0; }
function toggleScope() {
  state.scope = state.scope === 'tray' ? 'all' : 'tray';
  writeURL(); renderAll();
}
function scopeToggleHTML() {
  if (!state.tray.length) return '';
  const trayActive = state.scope === 'tray';
  return `
    <div class="scope-toggle" title="Switch between comparing tray-only and all runs">
      <button data-scope="tray" class="${trayActive ? 'active' : ''}">Tray · ${state.tray.length}</button>
      <button data-scope="all" class="${!trayActive ? 'active' : ''}">All · ${filteredRuns().length}</button>
    </div>`;
}

// ---------- Tray ----------
function toggleTray(runId) {
  const i = state.tray.indexOf(runId);
  const wasEmpty = state.tray.length === 0;
  if (i >= 0) state.tray.splice(i, 1);
  else {
    if (state.tray.length >= TRAY_CAP) {
      flash(`Tray is full (${TRAY_CAP} max). Remove one to add another.`);
      return;
    }
    state.tray.push(runId);
    // First item added → snap focus to tray scope
    if (wasEmpty) state.scope = 'tray';
  }
  writeURL();
  renderAll();
}
function clearTray() { state.tray = []; writeURL(); renderAll(); }
function flash(msg) {
  // lightweight inline flash: repurpose tray label briefly
  const el = document.querySelector('.tray-label');
  const orig = el.innerHTML;
  el.innerHTML = `<span style="color:var(--rose)">${msg}</span>`;
  setTimeout(() => { el.innerHTML = orig; }, 2400);
}

// ---------- Hero leaderboard ----------
function renderHero() {
  const top3 = sortedRuns().slice(0, 3);
  const el = document.getElementById('hero');
  if (!top3.length) { el.innerHTML = '<div class="muted">No runs match current filters.</div>'; return; }
  el.innerHTML = top3.map((r, i) => {
    const rank = i + 1;
    const inTray = state.tray.includes(r.run_id);
    const slot = traySlotIndex(r.run_id) + 1;
    const slotColor = slot ? TRAY_COLORS[slot - 1] : null;
    const pm = planLabel(r);
    const famK = familyKey(r);
    const sc = r.scores?.[state.metric];
    return `
      <div class="hero-card rank-${rank}" data-run="${r.run_id}"${inTray ? ` style="border-color:${slotColor}"` : ''}>
        <button class="add-btn ${inTray ? 'in-tray' : ''}" data-action="toggle-tray" title="${inTray ? 'Remove from tray' : 'Add to tray'}"${inTray ? ` style="background:${slotColor};border-color:${slotColor}"` : ''}>${inTray ? slot : '+'}</button>
        <div class="rank-badge"><span class="rank-dot"></span>${rank === 1 ? 'Leader' : rank === 2 ? 'Runner-up' : 'Third'}</div>
        <div class="model-name">${displayName(r)}</div>
        <div class="sub-line">
          <span class="pill family-${famK}">${shortTool(r)}</span>
          ${pm ? `<span class="pill ${pm === 'Plan' ? 'plan' : 'no-plan'}">${pm}</span>` : ''}
        </div>
        <div class="score">
          <span class="num">${fmt(sc)}</span><span class="unit">/ 100</span>
          <span class="label">${state.metric.toUpperCase()}</span>
        </div>
      </div>`;
  }).join('');
}

// ---------- Tray render ----------
function renderTray() {
  const slotsEl = document.getElementById('tray-slots');
  const countEl = document.getElementById('tray-count');
  countEl.textContent = `${state.tray.length}/${TRAY_CAP}`;
  document.getElementById('tray-clear').disabled = !state.tray.length;
  document.getElementById('tray-share').disabled = !state.tray.length;
  if (!state.tray.length) {
    slotsEl.innerHTML = `<span class="tray-slot-empty">Click any model to add. Up to ${TRAY_CAP}.</span>`;
    return;
  }
  slotsEl.innerHTML = state.tray.map((id, i) => {
    const r = findRun(id);
    if (!r) return '';
    const c = TRAY_COLORS[i];
    return `
      <span class="tray-chip" data-run="${id}" style="border-color:${c}66">
        <span class="slot-num" style="background:${c};color:#0b0d10">${i + 1}</span>
        <span>${displayName(r)}</span>
        <span class="muted" style="font-size:11px">${shortTool(r)}${planLabel(r) ? ' · ' + planLabel(r) : ''}</span>
        <button class="close" data-action="remove-tray" data-run="${id}" title="Remove">×</button>
      </span>`;
  }).join('');
}

// ---------- Comparison panel ----------
function renderComparePanel() {
  const el = document.getElementById('compare-panel');
  if (state.tray.length < 2) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden');
  const tRuns = state.tray.map(findRun).filter(Boolean);

  // Controlled analysis: taxonomy version match + exactly one varying dim
  const dims = ['model_id', 'tool_slug', 'effort_slug', 'planning_mode'];
  const varyList = dims.filter(d => new Set(tRuns.map(r => r[d])).size > 1);
  const taxVersions = new Set(tRuns.map(r => r.taxonomy_version).filter(Boolean));
  let badge = { cls: 'controlled-badge', text: '', label: '' };
  if (taxVersions.size > 1) {
    badge.cls = 'controlled-badge red';
    badge.text = `Mixed taxonomy versions (${[...taxVersions].join(', ')})`;
  } else if (varyList.length === 1) {
    badge.cls = 'controlled-badge';
    badge.text = `Controlled · varying ${varyList[0].replace('_slug', '').replace('_', ' ')}`;
  } else if (varyList.length === 0) {
    badge.cls = 'controlled-badge amber';
    badge.text = `Same configuration · compare replicates`;
  } else {
    badge.cls = 'controlled-badge amber';
    badge.text = `Uncontrolled · varying ${varyList.map(d => d.replace('_slug', '').replace('_', ' ')).join(', ')}`;
  }

  // Score delta bars — colored by tray slot, ordered by the selected metric
  const sevKeys = ['overall', 'critical', 'important', 'detail'];
  const scoresHtml = sevKeys.map(k => {
    const vals = tRuns.map(r => r.scores?.[k] ?? 0);
    const leader = Math.max(...vals);
    const rows = tRuns.map(r => {
      const v = r.scores?.[k] ?? 0;
      const c = trayColor(r.run_id) || familyColor(r);
      const isLead = v === leader && vals.some(x => x !== v);
      const slot = traySlotIndex(r.run_id) + 1;
      return `<div class="delta-row-mini">
        <span class="mname" title="${displayName(r)}"><span class="slot-tag" style="background:${c};color:#0b0d10">${slot}</span>${displayName(r)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${v}%;background:${c};opacity:${isLead ? 1 : 0.7}"></div></div>
        <span class="mval" style="color:${isLead ? c : 'var(--fg)'}">${fmt(v)}${isLead ? ' ★' : ''}</span>
      </div>`;
    }).join('');
    return `<div class="delta-row">
      <span class="delta-label">${k}</span>
      <div class="delta-bars">${rows}</div>
    </div>`;
  }).join('');

  // Runtime / tool-calls delta rows — nice to see alongside quality
  const runtimeVals = tRuns.map(r => r.planning_runtime_seconds ?? 0);
  const tcVals = tRuns.map(r => r.plan_tool_call_count ?? 0);
  const rtMax = Math.max(1, ...runtimeVals);
  const tcMax = Math.max(1, ...tcVals);
  // For runtime / tool-calls, lower is better — "leader" is the min non-zero.
  const rtBest = Math.min(...runtimeVals.filter(v => v > 0));
  const tcBest = Math.min(...tcVals.filter(v => v > 0));
  const rtRows = tRuns.map(r => {
    const v = r.planning_runtime_seconds ?? 0;
    const c = trayColor(r.run_id) || familyColor(r);
    const isBest = v === rtBest && runtimeVals.some(x => x !== v);
    const slot = traySlotIndex(r.run_id) + 1;
    return `<div class="delta-row-mini">
      <span class="mname"><span class="slot-tag" style="background:${c};color:#0b0d10">${slot}</span>${displayName(r)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${v / rtMax * 100}%;background:${c};opacity:${isBest ? 1 : 0.55}"></div></div>
      <span class="mval" style="color:${isBest ? c : 'var(--fg)'}">${fmtSec(v)}${isBest ? ' ★' : ''}</span>
    </div>`;
  }).join('');
  const tcRows = tRuns.map(r => {
    const v = r.plan_tool_call_count ?? 0;
    const c = trayColor(r.run_id) || familyColor(r);
    const isBest = v === tcBest && tcVals.some(x => x !== v);
    const slot = traySlotIndex(r.run_id) + 1;
    return `<div class="delta-row-mini">
      <span class="mname"><span class="slot-tag" style="background:${c};color:#0b0d10">${slot}</span>${displayName(r)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${v / tcMax * 100}%;background:${c};opacity:${isBest ? 1 : 0.55}"></div></div>
      <span class="mval" style="color:${isBest ? c : 'var(--fg)'}">${v}${isBest ? ' ★' : ''}</span>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="compare-head">
      <h3>Head to head · ${tRuns.length} runs</h3>
      <span class="${badge.cls}">${badge.text}</span>
      <span class="muted" style="font-size:12px;margin-left:auto">★ = leader in row</span>
    </div>
    <div class="compare-grid">
      <div>
        ${scoresHtml}
        <div class="delta-row"><span class="delta-label">runtime</span><div class="delta-bars">${rtRows}</div></div>
        <div class="delta-row"><span class="delta-label">tool calls</span><div class="delta-bars">${tcRows}</div></div>
      </div>
      <div>
        <div id="compare-radar" style="width:100%;height:320px"></div>
        <div id="compare-mini-frontier" style="width:100%;height:220px;margin-top:8px"></div>
      </div>
    </div>
  `;
  renderRadar(tRuns);
  renderMiniFrontier(tRuns);
}

function renderRadar(tRuns) {
  const el = document.getElementById('compare-radar');
  if (!el) return;
  // Build union of area names that appear in all runs (if mixed tax, use intersection)
  if (!tRuns.every(r => Array.isArray(r.area_scores) && r.area_scores.length)) {
    el.innerHTML = '<div class="muted" style="padding:12px;font-size:12px">Per-area radar unavailable (missing area_scores).</div>';
    return;
  }
  const areaNames = [];
  (tRuns[0].area_scores || []).forEach(a => areaNames.push(a.name));
  const commonAreas = areaNames.filter(n => tRuns.every(r => (r.area_scores || []).some(a => a.name === n)));
  if (commonAreas.length < 3) {
    el.innerHTML = '<div class="muted" style="padding:12px;font-size:12px">Not enough shared functional areas for a radar (taxonomy mismatch).</div>';
    return;
  }
  const chart = echarts.init(el, null, { renderer: 'canvas' });
  // Wrap long area names onto two lines instead of truncating
  const wrap = name => {
    if (name.length <= 18) return name;
    const parts = name.split(/\s+/);
    const mid = Math.ceil(parts.length / 2);
    return parts.slice(0, mid).join(' ') + '\n' + parts.slice(mid).join(' ');
  };
  const indicator = commonAreas.map(n => ({ name: wrap(n), max: 100 }));
  const series = tRuns.map(r => {
    const lookup = new Map((r.area_scores || []).map(a => [a.name, a.score]));
    const c = runColor(r);
    return {
      name: displayName(r),
      value: commonAreas.map(n => lookup.get(n) ?? 0),
      areaStyle: { opacity: 0.15, color: c },
      lineStyle: { width: 2, color: c },
      itemStyle: { color: c },
      symbolSize: 5,
    };
  });
  chart.setOption({
    tooltip: { trigger: 'item' },
    legend: {
      data: series.map(s => s.name), bottom: 0,
      textStyle: { color: '#bcb8ad', fontSize: 11 },
      itemWidth: 10, itemHeight: 10,
    },
    radar: {
      indicator, shape: 'polygon',
      radius: '65%', center: ['50%', '48%'],
      name: { textStyle: { color: '#bcb8ad', fontSize: 10, lineHeight: 12 } },
      splitLine: { lineStyle: { color: '#262b33' } },
      splitArea: { areaStyle: { color: ['rgba(255,255,255,0.01)', 'rgba(255,255,255,0.025)'] } },

// Tray scope: one scatter series per run so each has its own slot-colored bubble
// and its own legend entry. Axes auto-frame around the data so 2-3 points don't
// pile into one corner of the log axis.
function renderFrontierTrayScope(chart, runs) {
  const runtimes = runs.map(r => r.planning_runtime_seconds || 0).filter(v => v > 0);
  const rtMin = runtimes.length ? Math.min(...runtimes) : 1;
  const rtMax = runtimes.length ? Math.max(...runtimes) : 60;
  // Pad on a log scale: at least one decade of breathing room
  const xMin = Math.max(0.5, rtMin / 2);
  const xMax = Math.max(rtMax * 2, rtMin * 4);

  const scores = runs.map(r => r.scores?.[state.metric] ?? 0);
  const scoreMin = Math.min(...scores, 100);
  const scoreMax = Math.max(...scores, 0);
  const yPad = Math.max(6, (scoreMax - scoreMin) * 0.35);
  const yMin = Math.max(0, Math.floor(scoreMin - yPad));
  const yMax = Math.min(100, Math.ceil(scoreMax + yPad));

  const series = runs.map((r, i) => {
    const c = TRAY_COLORS[i];
    const runtime = r.planning_runtime_seconds || 0;
    const score = r.scores?.[state.metric] ?? 0;
    const toolCalls = r.plan_tool_call_count || 0;
    return {
      name: `${i + 1}. ${displayName(r)}`,
      type: 'scatter',
      symbolSize: 48,
      data: [{
        value: [runtime, score, r.run_id, toolCalls, displayName(r), shortTool(r), planLabel(r) || '—'],
      }],
      itemStyle: { color: c, borderColor: '#0b0d10', borderWidth: 3, opacity: 0.96,
        shadowBlur: 12, shadowColor: c.replace(')', ',0.35)').replace('rgb', 'rgba') || `${c}55` },
      emphasis: { scale: 1.15, itemStyle: { borderColor: '#f2f0ea' } },
      label: {
        show: true, position: 'inside', color: '#0b0d10',
        fontFamily: 'JetBrains Mono', fontSize: 16, fontWeight: 700,
        formatter: `${i + 1}`,
      },
      markLine: {
        silent: true, symbol: 'none',
        lineStyle: { color: c, opacity: 0.35, type: 'dashed', width: 1 },
        data: [
          { xAxis: runtime, label: { show: false } },
          { yAxis: score, label: { show: false } },
        ],
      },
    };
  });

  chart.setOption({
    tooltip: {
      trigger: 'item',
      backgroundColor: '#1c2026', borderColor: '#262b33', textStyle: { color: '#f2f0ea', fontSize: 13 },
      formatter: p => {
        const v = p.data.value; if (!v) return '';
        return `<b>${p.seriesName}</b><br>${v[5]} · ${v[6]}<br>${state.metric.toUpperCase()}: ${fmt(v[1])} · Runtime: ${fmtSec(v[0])}<br>Tool calls: ${v[3]}`;
      },
    },
    legend: {
      top: 0, left: 'center',
      textStyle: { color: '#bcb8ad', fontSize: 12 },
      icon: 'circle', itemWidth: 10, itemHeight: 10, itemGap: 18,
    },
    grid: { top: 60, left: 70, right: 40, bottom: 58 },
    xAxis: {
      type: 'log', min: xMin, max: xMax,
      name: 'Planning runtime  (log scale)', nameLocation: 'middle', nameGap: 34,
      nameTextStyle: { color: '#8a887f', fontSize: 12 },
      axisLabel: { color: '#bcb8ad', fontSize: 11,
        formatter: v => v >= 60 ? `${(v / 60).toFixed(v >= 600 ? 0 : 1)}m` : `${Math.round(v)}s` },
      splitLine: { lineStyle: { color: '#1e2229' } },
      axisLine: { lineStyle: { color: '#262b33' } },
    },
    yAxis: {
      type: 'value', min: yMin, max: yMax,
      name: `${state.metric.toUpperCase()} score`, nameLocation: 'middle', nameGap: 44,
      nameTextStyle: { color: '#8a887f', fontSize: 12 },
      axisLabel: { color: '#bcb8ad', fontSize: 11 },
      splitLine: { lineStyle: { color: '#1e2229' } },
      axisLine: { lineStyle: { color: '#262b33' } },
    },
    series,
  });
}

function renderFrontierAllScope(chart, runs) {
  // Build series by family so families share a legend entry
  const byFamily = {};
  runs.forEach(r => {
    const k = familyKey(r);
    (byFamily[k] ||= []).push(r);

  const paretoIds = computePareto(runs);
  const hasTray = state.tray.length > 0;

  const series = Object.entries(byFamily).map(([k, list]) => ({
    name: k[0].toUpperCase() + k.slice(1),
    type: 'scatter',
    symbolSize: d => {
      const v = Array.isArray(d) ? d : d.value;
      const base = Math.max(14, Math.min(40, Math.sqrt((v[3] || 1)) * 4));

    },
    data: list.map(r => {
      const inTray = state.tray.includes(r.run_id);
      const slot = state.tray.indexOf(r.run_id) + 1;
      const inPareto = paretoIds.has(r.run_id);
      return {
        value: [
          r.planning_runtime_seconds || 0,
          r.scores?.[state.metric] ?? 0,
          r.run_id,
          r.plan_tool_call_count || 1,
          displayName(r),
          shortTool(r),
          planLabel(r) || '—',
          inTray,
          inPareto,
          slot,
        ],
        itemStyle: {
          color: inTray ? TRAY_COLORS[slot - 1] : (FAMILY_COLOR[k] || '#8a887f'),
          borderColor: inTray ? '#f2f0ea' : (inPareto ? '#d4b36a' : 'transparent'),
          borderWidth: inTray ? 2 : (inPareto ? 2 : 0),
          opacity: hasTray && !inTray ? 0.22 : 0.9,
        },
        label: {
          color: inTray ? '#f2f0ea' : (hasTray ? '#4a4840' : '#bcb8ad'),
          fontWeight: inTray ? 600 : 400,
        },
      };
    }),
    emphasis: { focus: 'series', scale: 1.2, itemStyle: { borderColor: '#f2f0ea', borderWidth: 2 } },
    label: {
      show: true, position: 'top', fontSize: 10,
      formatter: p => p.value[7] ? `${p.value[9]}. ${p.value[4]}` : p.value[4],
      distance: 8,
    },
    labelLayout: { hideOverlap: true, moveOverlap: 'shiftY' },
  }));

  const paretoRuns = runs.filter(r => paretoIds.has(r.run_id))
    .sort((a, b) => (a.planning_runtime_seconds || 0) - (b.planning_runtime_seconds || 0));
  if (paretoRuns.length >= 2) {
    series.push({
      name: 'Pareto frontier',
      type: 'line',
      data: paretoRuns.map(r => [r.planning_runtime_seconds || 0, r.scores?.[state.metric] ?? 0]),
      lineStyle: { color: '#d4b36a', width: 1, type: 'dashed', opacity: 0.6 },
      showSymbol: false, smooth: false, silent: true, z: 1,
    });
  }

  chart.setOption({
    tooltip: {
      trigger: 'item',
      backgroundColor: '#1c2026', borderColor: '#262b33', textStyle: { color: '#f2f0ea', fontSize: 12 },
      formatter: p => {
        if (p.seriesName === 'Pareto frontier') return '';
        const [runtime, score, id, toolCalls, name, tool, plan] = p.value;
        return `<b>${name}</b><br>${tool} · ${plan}<br>Score: ${fmt(score)} · Runtime: ${fmtSec(runtime)}<br>Tool calls: ${toolCalls}`;
      },
    },
    legend: { top: 0, right: 0, textStyle: { color: '#bcb8ad' } },
    grid: { top: 40, left: 60, right: 30, bottom: 60 },
    xAxis: {
      type: 'log', name: 'Planning runtime (s)', nameLocation: 'middle', nameGap: 32,
      nameTextStyle: { color: '#8a887f' },
      axisLabel: { color: '#bcb8ad', formatter: v => v >= 60 ? `${(v / 60).toFixed(v >= 600 ? 0 : 1)}m` : `${v}s` },
      splitLine: { lineStyle: { color: '#1e2229' } },
      axisLine: { lineStyle: { color: '#262b33' } },
    },
    yAxis: {
      type: 'value', name: `${state.metric.toUpperCase()} score`, nameLocation: 'middle', nameGap: 42,
      nameTextStyle: { color: '#8a887f' },
      min: 0, max: 100,
      axisLabel: { color: '#bcb8ad', formatter: '{value}' },
      splitLine: { lineStyle: { color: '#1e2229' } },
      axisLine: { lineStyle: { color: '#262b33' } },
    },
    dataZoom: [
      { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
      { type: 'inside', yAxisIndex: 0, filterMode: 'none' },
    ],
    series,
  });
}

function computePareto(runs) {
  // Pareto-optimal in (score high, runtime low)
  const ids = new Set();
  const pts = runs.map(r => ({
    id: r.run_id,
    s: r.scores?.[state.metric] ?? 0,
    t: r.planning_runtime_seconds ?? Infinity,
  }));
  pts.forEach(p => {
    const dominated = pts.some(q => q !== p && q.s >= p.s && q.t <= p.t && (q.s > p.s || q.t < p.t));
    if (!dominated) ids.add(p.id);
  });
  return ids;
}

// ---------- Heatmap view ----------
function renderHeatmap() {
  const el = document.getElementById('view-heatmap');
  const inTrayScope = scopeActive();
  const runs = inTrayScope ? scopedRuns() : sortedRuns();

  // Build matrix first so we can auto-fit the color scale to actual data
  const areaSet = new Map(); // name -> count
  runs.forEach(r => (r.area_scores || []).forEach(a => {
    areaSet.set(a.name, (areaSet.get(a.name) || 0) + 1);
  }));
  const areaNames = [...areaSet.keys()]; // order preserved as first-seen

  // Strictly 3-element tuples so visualMap binds cleanly to dim 2.
  // Extra per-cell metadata is stored in a side map for tooltip lookup.
  const data = [];
  const cellMeta = new Map(); // key `${y}:${x}` -> { counts }
  runs.forEach((r, y) => {
    const lookup = new Map((r.area_scores || []).map(a => [a.name, a]));
    areaNames.forEach((name, x) => {
      const a = lookup.get(name);
      if (!a) { data.push([x, y, '-']); return; }
      data.push([x, y, a.score]);
      cellMeta.set(`${y}:${x}`, { counts: a.counts });
    });
  });

  // Auto-fit the color scale to actual data so clustered high scores
  // get meaningful separation instead of bunching in the top of the ramp.
  const numericValues = data.map(d => d[2]).filter(v => typeof v === 'number');
  const actualMin = numericValues.length ? Math.min(...numericValues) : 0;
  const actualMax = numericValues.length ? Math.max(...numericValues) : 100;
  const vmMin = Math.max(0, Math.floor((actualMin - 5) / 5) * 5);
  const vmMax = Math.min(100, Math.max(vmMin + 15, Math.ceil(actualMax / 5) * 5));
  const stretched = vmMin > 0 || vmMax < 100;

  const subtitle = inTrayScope
    ? `Tray only (${runs.length}) · click a row to remove from tray`
    : `Per-functional-area scores · click a row to toggle · hover a cell for coverage detail`;
  const scaleNote = stretched
    ? `<span class="muted" style="font-size:11px;margin-left:4px">· color scale fitted to ${vmMin}–${vmMax} to emphasize differences</span>`
    : '';

  // Sensible row height: tray scope uses generous rows so per-area scores read at a glance;
  // "all" mode packs tighter to fit up to 14 rows without becoming wall-sized.
  const rowHeight = inTrayScope ? 72 : 34;
  const chartHeight = 80 + runs.length * rowHeight + 80;

  el.innerHTML = `
    <div class="view-head">
      <div>
        <h2>Area Heatmap</h2>
        <p>${subtitle}${scaleNote}</p>
      </div>
      <div class="spacer"></div>
      ${scopeToggleHTML()}
    </div>
    <div id="heatmap-chart" style="height:${chartHeight}px"></div>
  `;
  // Dispose any prior instance on this node so setOption binds to a clean chart
  const hmNode = document.getElementById('heatmap-chart');
  const prior = echarts.getInstanceByDom(hmNode);
  if (prior) prior.dispose();
  const chart = echarts.init(document.getElementById('heatmap-chart'), null, { renderer: 'canvas' });

  // Color ramp: red → terra → gold → sage → green, with extra midrange stops for separation
  const colorRamp = ['#8b3a3a', '#c25c4c', '#d48c5a', '#d4b36a', '#e8d88a', '#c8d6a7', '#8eb28c', '#6e9d76', '#4f7a57'];

  chart.setOption({
    tooltip: {
      backgroundColor: '#1c2026', borderColor: '#262b33', textStyle: { color: '#f2f0ea', fontSize: 12 },
      formatter: p => {
        const v = p.data[2];
        const r = runs[p.data[1]];
        if (v === '-' || v == null) return `<b>${r ? displayName(r) : ''}</b><br>${areaNames[p.data[0]]}<br><span style="color:#8a887f">n/a</span>`;
        const meta = cellMeta.get(`${p.data[1]}:${p.data[0]}`) || {};
        const counts = meta.counts || {};
        return `<b>${displayName(r)}</b><br>${areaNames[p.data[0]]}<br>Score: <b>${fmt(v)}</b><br>Full ${counts.full ?? '?'} · Partial ${counts.partial ?? '?'} · Missing ${counts.missing ?? '?'}`;
      },
    },
    grid: { left: 280, right: 90, top: 40, bottom: 90 },
    xAxis: {
      type: 'category', data: areaNames, position: 'bottom',
      axisLabel: {
        color: '#bcb8ad', rotate: 32, fontSize: 11, interval: 0,
        formatter: v => v.length > 24 ? v.slice(0, 22) + '…' : v,
        margin: 10,
      },
      splitArea: { show: false }, axisLine: { lineStyle: { color: '#262b33' } },
      axisTick: { show: false },
    },
    yAxis: {
      type: 'category',
      data: runs.map(r => {
        const slot = traySlotIndex(r.run_id) + 1;
        const pmStr = planLabel(r) ? ' · ' + planLabel(r) : '';
        return slot ? `{slot${slot}|${slot}}  ${displayName(r)}${pmStr}` : displayName(r) + pmStr;
      }),
      inverse: true,
      axisLabel: {
        color: '#f2f0ea', fontSize: inTrayScope ? 14 : 12, fontWeight: 500,
        margin: 12,
        rich: Object.fromEntries(TRAY_COLORS.map((c, i) => [`slot${i + 1}`, {
          backgroundColor: c, color: '#0b0d10',
          padding: [3, 6], borderRadius: 3,
          fontFamily: 'JetBrains Mono', fontSize: 11, fontWeight: 700,
        }])),
      },
      axisLine: { lineStyle: { color: '#262b33' } },
      axisTick: { show: false },
    },
    visualMap: {
      type: 'continuous',
      min: vmMin, max: vmMax,
      dimension: 2,
      seriesIndex: 0,
      orient: 'vertical', right: 12, top: 40, bottom: 100,
      textStyle: { color: '#bcb8ad', fontSize: 11 },
      inRange: { color: colorRamp },
      calculable: true,
      itemWidth: 12, itemHeight: Math.max(140, runs.length * (inTrayScope ? 46 : 22)),
      text: [`${vmMax}`, `${vmMin}`],
      show: true,
    },
    series: [{
      name: 'Area Score', type: 'heatmap', data,
      progressive: 0,
      label: {
        show: true,
        fontSize: inTrayScope ? 16 : 11,
        fontWeight: 700, fontFamily: 'JetBrains Mono',
        color: '#0b0d10',
        formatter: p => (p.data[2] === '-' || p.data[2] == null) ? '' : Math.round(p.data[2]),
      },
      itemStyle: { borderColor: '#0b0d10', borderWidth: 2 },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(212,179,106,0.7)', borderColor: '#f2f0ea', borderWidth: 2 } },
    }],
  });
  setTimeout(() => chart.resize(), 10);

  chart.off('click');
  chart.on('click', p => {
    const r = runs[p.data[1]];
    if (r) toggleTray(r.run_id);
  });
  window.addEventListener('resize', () => chart.resize());
}

// ---------- Deep Dive ----------
function renderDeepDive() {
  const el = document.getElementById('view-deepdive');
  const runs = sortedRuns();
  if (!state.deepdive || !findRun(state.deepdive)) {
    state.deepdive = runs[0]?.run_id;
  }
  const r = findRun(state.deepdive);
  if (!r) { el.innerHTML = '<p class="muted">No run selected.</p>'; return; }

  const sc = r.scores || {};
  const areas = (r.area_scores || []).slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  const gaps = (r.top_gaps || []).slice(0, 6);
  const narr = r.narrative || {};
  const art = r.artifacts || {};
  const inTray = state.tray.includes(r.run_id);

  const options = runs.map(x => `<option value="${x.run_id}"${x.run_id === r.run_id ? ' selected' : ''}>${displayName(x)} · ${shortTool(x)}${planLabel(x) ? ' · ' + planLabel(x) : ''}</option>`).join('');

  el.innerHTML = `
    <div class="view-head">
      <div>
        <h2>Deep Dive</h2>
        <p>Per-model breakdown: scores by severity · strongest and weakest areas · top remediation gaps · full evaluation artifacts</p>
      </div>
      <div class="spacer"></div>
      <select id="dd-picker" style="min-width:280px;padding:8px 10px">${options}</select>
      <button class="btn ${inTray ? 'primary' : ''}" id="dd-tray">${inTray ? 'In tray' : '+ Compare'}</button>
    </div>

    <div class="dd-scores" style="margin-bottom:18px">
      ${['overall', 'critical', 'important', 'detail'].map(k => `
        <div class="dd-score-cell ${k}">
          <div class="label">${k.toUpperCase()}</div>
          <div class="num" style="color:${scoreColor(sc[k] || 0)}">${fmt(sc[k])}</div>
        </div>`).join('')}
    </div>

    <div class="dd-grid">
      <div class="dd-panel">
        <h3>Functional areas · ${areas.length}</h3>
        ${areas.map(a => `
          <div class="dd-area-row">
            <span class="name">${a.name}</span>
            <div class="bar"><div class="fill" style="width:${a.score || 0}%;background:${scoreColor(a.score || 0)}"></div></div>
            <span class="val">${fmt(a.score)}</span>
          </div>`).join('')}
      </div>

      <div class="dd-panel">
        <h3>Top gaps · ${gaps.length}</h3>
        ${gaps.length ? gaps.map(g => `
          <div class="dd-gap sev-${g.severity}">
            <span class="sev">${g.severity}</span>
            <span class="label">${g.label || g.id}</span>
          </div>`).join('') : '<p class="muted" style="font-size:12px">No gaps recorded for this run.</p>'}
      </div>
    </div>

    <div class="dd-panel" style="margin-top:14px">
      <h3>Narrative</h3>
      <div class="dd-narrative">
        ${narr.overall_posture ? `<p><strong>Overall:</strong> ${narr.overall_posture}</p>` : ''}
        ${narr.strength_clusters ? `<p><strong>Strengths:</strong> ${narr.strength_clusters}</p>` : ''}
        ${narr.weakness_clusters ? `<p><strong>Weaknesses:</strong> ${narr.weakness_clusters}</p>` : ''}
        ${narr.risk_assessment ? `<p><strong>Risks:</strong> ${narr.risk_assessment}</p>` : ''}
        ${!narr.overall_posture && !narr.strength_clusters ? '<p class="muted" style="font-size:12px">No narrative recorded.</p>' : ''}
      </div>
    </div>

    <div class="dd-panel" style="margin-top:14px">
      <h3>Artifacts</h3>
      <div class="dd-links">
        ${art.plan_eval_report_url ? `<a href="${art.plan_eval_report_url}" target="_blank">Full Plan Eval Report ↗</a>` : ''}
        ${art.plan_url ? `<a href="${art.plan_url}" target="_blank">PLAN.md ↗</a>` : ''}
        ${art.plan_eval_url ? `<a href="${art.plan_eval_url}" target="_blank">PLAN_EVAL.md ↗</a>` : ''}
        ${art.run_metadata_url ? `<a href="${art.run_metadata_url}" target="_blank">run_metadata.json ↗</a>` : ''}
      </div>
    </div>
  `;

  document.getElementById('dd-picker').addEventListener('change', e => {
    state.deepdive = e.target.value; writeURL(); renderDeepDive();
  });
  document.getElementById('dd-tray').addEventListener('click', () => toggleTray(r.run_id));
}

// ---------- Populate filter options ----------
function populateFilters() {
  const families = [...new Set(RUNS.map(familyKey))].filter(f => f !== 'other');
  const tools = [...new Set(RUNS.map(r => r.tool_slug).filter(Boolean))];
  document.getElementById('f-family').innerHTML = '<option value="">All</option>' + families.map(f => `<option value="${f}"${state.filters.family === f ? ' selected' : ''}>${f[0].toUpperCase() + f.slice(1)}</option>`).join('');
  document.getElementById('f-tool').innerHTML = '<option value="">All</option>' + tools.map(t => `<option value="${t}"${state.filters.tool === t ? ' selected' : ''}>${t}</option>`).join('');
  document.getElementById('f-metric').value = state.metric;
  document.getElementById('f-plan').value = state.filters.planning_mode;
}

// ---------- Tabs ----------
function setView(v) {
  state.view = v; writeURL(); renderAll();
}
function renderView() {
  ['leaderboard', 'frontier', 'heatmap', 'deepdive'].forEach(v => {
    document.getElementById(`view-${v}`).classList.toggle('hidden', v !== state.view);
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view));
  if (state.view === 'leaderboard') renderLeaderboard();
  else if (state.view === 'frontier') renderFrontier();
  else if (state.view === 'heatmap') renderHeatmap();
  else if (state.view === 'deepdive') renderDeepDive();
}

// ---------- Top-level render ----------
function renderAll() {
  renderHero();
  renderTray();
  renderComparePanel();
  renderView();
  document.getElementById('runs-chip').textContent = `${RUNS.length} runs · ${DATA.summary?.series_count || 0} series`;
  document.getElementById('gen-stamp').textContent = `Data as of ${new Date(DATA.generated_at).toLocaleString()} · schema v${DATA.schema_version} · ${RUNS.length} runs · no replicates yet`;
  document.body.classList.toggle('record-mode', state.recordMode);
  document.getElementById('btn-record').classList.toggle('active', state.recordMode);
}

// ---------- Event wiring ----------
function wire() {
  // Tabs
  document.getElementById('tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    setView(t.dataset.view);
  });

  // Scope toggle clicks (delegated — toggle lives inside view heads)
  document.addEventListener('click', e => {
    const b = e.target.closest('.scope-toggle button[data-scope]');
    if (!b) return;
    const next = b.dataset.scope;
    if (state.scope === next) return;
    state.scope = next; writeURL(); renderAll();
  });

  // Filters
  document.getElementById('f-metric').addEventListener('change', e => { state.metric = e.target.value; writeURL(); renderAll(); });
  document.getElementById('f-family').addEventListener('change', e => { state.filters.family = e.target.value; writeURL(); renderAll(); });
  document.getElementById('f-tool').addEventListener('change', e => { state.filters.tool = e.target.value; writeURL(); renderAll(); });
  document.getElementById('f-plan').addEventListener('change', e => { state.filters.planning_mode = e.target.value; writeURL(); renderAll(); });

  // Hero clicks
  document.getElementById('hero').addEventListener('click', e => {
    if (e.target.closest('[data-action="toggle-tray"]')) {
      const card = e.target.closest('.hero-card');
      toggleTray(card.dataset.run);
      e.stopPropagation();
      return;
    }
    const card = e.target.closest('.hero-card');
    if (card) toggleTray(card.dataset.run);
  });

  // Tray clicks
  document.getElementById('tray-slots').addEventListener('click', e => {
    const btn = e.target.closest('[data-action="remove-tray"]');
    if (btn) toggleTray(btn.dataset.run);
  });
  document.getElementById('tray-clear').addEventListener('click', clearTray);
  document.getElementById('tray-share').addEventListener('click', async () => {
    await navigator.clipboard.writeText(location.href);
    const btn = document.getElementById('tray-share');
    const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = t, 1200);
  });

  // Record Mode
  document.getElementById('btn-record').addEventListener('click', () => {
    state.recordMode = !state.recordMode; writeURL(); renderAll();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === 'r' || e.key === 'R') { state.recordMode = !state.recordMode; writeURL(); renderAll(); }
    if (e.key === '1') setView('leaderboard');
    if (e.key === '2') setView('frontier');
    if (e.key === '3') setView('heatmap');
    if (e.key === '4') setView('deepdive');
    if (e.key === 'Escape') { if (state.tray.length) clearTray(); }
  });
}

// ---------- Bootstrap ----------
readURL();
populateFilters();
wire();
renderAll();
</script>
</body>
</html>
